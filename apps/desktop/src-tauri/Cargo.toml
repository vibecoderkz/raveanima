[package]
name = "anima"
version = "0.2.0"
description = "RaveAnima: 2D vector design and animation for humans and AI agents"
authors = ["Dias Zhumagaliyev <hello@dias.now>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/vibecoderkz/raveanima"
homepage = "https://dias.now"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"
percent-encoding = "2"
dirs = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
